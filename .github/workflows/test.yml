name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job reads the tree and runs a test suite. Nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor the README promises, and the current release.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          # Do not leave the job's token in the checkout's git config.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
